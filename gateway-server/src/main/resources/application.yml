# ============================================================================
# 企业 AI 网关配置（本地开发环境）
# 依赖的中间件由仓库根目录 docker-compose.yml 提供：
#   MySQL 8（元数据库）-> localhost:3307（本机 3306 被占用，故映射 3307）
# ============================================================================
spring:
  application:
    name: ai-gateway
  datasource:
    # 元数据库（文档 3.3）：tool_registry / casbin_rule / approval_request / client_registry / audit_log
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:ai_gateway}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USER:gateway}
    password: ${DB_PASSWORD:gateway123456}
  data:
    redis:
      # 会话存储与三维限流（文档 3.3/6.2）；本地未启动 Redis 时相关功能不可用，但服务可正常启动
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

# 预留配置位（随各模块实现逐步填充）：
# - identity: 飞书 appId/appSecret、内部 JWT 签名密钥（文档 6.2）
# - policy:   Casbin model 路径、限流配额（文档 6.3）
# - audit:    sink 类型（doris / jdbc / log）、批量大小与间隔（文档 6.6）
