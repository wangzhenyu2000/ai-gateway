// ============================================================================
// 企业 AI 网关构建脚本
// 技术选型（设计文档 3.3）：Java 21 + Spring Boot 3 + WebFlux
// 依赖与团队 rsk-gateway 项目保持同体系（Spring Boot 3.5.16 / springdoc 2.8.14）
// ============================================================================
plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.uemind.merlion.ai'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        // 设计文档 3.3：Java 21
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// 源码含中文注释，强制 UTF-8 编译，避免 Windows 默认 GBK 乱码
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

dependencies {
    // ---- 协议与 Web 层（access，文档 6.1）----
    // IO 密集的代理与流式转发，使用响应式模型（文档 3.3）
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // ---- 身份与安全（identity，文档 6.2）----
    // Spring Security 校验网关自签发内部 JWT（RS256）
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // ---- 缓存与限流（文档 3.3：限流 Bucket4j + Redis；会话/身份信息缓存 Redis）----
    implementation 'org.springframework.boot:spring-boot-starter-data-redis-reactive'
    implementation 'com.bucket4j:bucket4j-core:8.7.0'

    // ---- 元数据库与策略（文档 3.3：MySQL 8；Casbin adapter 直连 MySQL 热加载）----
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.casbin:jcasbin:1.55.0'

    // ---- Admin API 文档（admin，文档 6.8）----
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.14'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
